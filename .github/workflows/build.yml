name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  # electron 44 and @electron/get 5 declare engines node >= 22.12.0
  NODE_VERSION: '22'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: SleekRec-Windows
          - os: macos-latest
            platform: mac
            artifact: SleekRec-macOS
          - os: ubuntu-latest
            platform: linux
            artifact: SleekRec-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Recording tests
        run: npm test

      - name: Generate icons
        run: npm run icons

      # Linux-specific: Install additional dependencies for electron-builder
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      # Developer ID signing and notarization need all five secrets; with none the app stays unsigned
      # and its in-app updater stays off. electron-builder skips signing on pull requests.
      - name: Prepare macOS signing
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          present=0
          for value in "$MACOS_CERTIFICATE_P12" "$MACOS_CERTIFICATE_PASSWORD" "$APPLE_API_KEY_P8" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo "No Apple signing secrets: building an unsigned macOS app"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$present" -ne 5 ]; then
            echo "::error::Set all of MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER, or none for an unsigned build"
            exit 1
          fi
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/notary-api-key.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode -o "$certificate"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$api_key"
          # electron-builder signs from CSC_*, then notarizes with notarytool from APPLE_API_*.
          {
            echo "CSC_LINK=$certificate"
            echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PASSWORD"
            echo "APPLE_API_KEY=$api_key"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build Electron app
        run: npm run build:${{ matrix.platform }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: |
          echo "Build output:"
          ls -la dist_app/

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist_app/*.exe
            dist_app/*.msi
            dist_app/*.blockmap
            dist_app/latest.yml
          if-no-files-found: warn

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist_app/*.dmg
            dist_app/*.zip
            dist_app/*.blockmap
            dist_app/latest-mac.yml
          if-no-files-found: warn

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist_app/*.AppImage
            dist_app/*.deb
            dist_app/*.rpm
            dist_app/latest-linux.yml
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/SleekRec-Windows/*
            artifacts/SleekRec-macOS/*
            artifacts/SleekRec-Linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
