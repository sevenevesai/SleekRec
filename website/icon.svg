<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer border gradient - light to dark purple -->
    <linearGradient id="outerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B8E8"/>
      <stop offset="50%" stop-color="#A87BC5"/>
      <stop offset="100%" stop-color="#7B5A99"/>
    </linearGradient>

    <!-- Inner border gradient - darker purple -->
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3A5C"/>
      <stop offset="100%" stop-color="#2A2235"/>
    </linearGradient>

    <!-- Fill gradient - off-white with slight purple tint -->
    <linearGradient id="fillGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0EBF5"/>
    </linearGradient>

    <!-- Lens gradient -->
    <radialGradient id="lensGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A2A4A"/>
      <stop offset="70%" stop-color="#1A1520"/>
      <stop offset="100%" stop-color="#0D0A10"/>
    </radialGradient>

    <!-- Lens ring gradient -->
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A8E0"/>
      <stop offset="100%" stop-color="#8B6AAB"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square border -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#outerGradient)"/>

  <!-- Inner rounded square border -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="url(#innerGradient)"/>

  <!-- Main fill area -->
  <rect x="52" y="52" width="408" height="408" rx="64" ry="64" fill="url(#fillGradient)"/>

  <!-- Camera lens - outer ring -->
  <circle cx="256" cy="236" r="100" fill="none" stroke="url(#innerGradient)" stroke-width="16"/>

  <!-- Camera lens - purple ring -->
  <circle cx="256" cy="236" r="84" fill="none" stroke="url(#ringGradient)" stroke-width="8"/>

  <!-- Camera lens - main dark area -->
  <circle cx="256" cy="236" r="72" fill="url(#lensGradient)"/>

  <!-- Lens highlight arc -->
  <path d="M 210 210 A 55 55 0 0 1 280 195" fill="none" stroke="#C9A8E0" stroke-width="6" stroke-linecap="round"/>

  <!-- Small indicator circle (flash) -->
  <circle cx="390" cy="122" r="24" fill="#B8A0D0"/>

  <!-- Vent lines detail -->
  <g>
    <line x1="145" y1="358" x2="367" y2="358" stroke="#3D2D4D" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
    <line x1="145" y1="382" x2="367" y2="382" stroke="#3D2D4D" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
    <line x1="145" y1="406" x2="367" y2="406" stroke="#3D2D4D" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
    <line x1="145" y1="430" x2="367" y2="430" stroke="#3D2D4D" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
