<!doctype html>
<html lang="en" class="overlay">
  <head>
    <meta charset="UTF-8" />
    <!-- Same policy as index.html; vite.config.ts loosens it for the dev server only. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleek Recorder</title>
  </head>
  <body class="text-white overflow-hidden">
    <div class="h-screen w-full flex items-center justify-between px-4 bg-surface/95 rounded-xl border border-gray-700/50 draggable">
      <div class="flex items-center gap-3">
        <!-- No animation: this window floats over the game, and a pulse repaints it at display refresh. -->
        <div id="dot" class="w-3 h-3 rounded-full bg-red-500"></div>
        <div>
          <span id="timer" class="text-white font-mono text-xl tracking-wider">0:00</span>
          <div id="fps" class="text-xs text-gray-400 hidden"></div>
        </div>
      </div>

      <div class="flex items-center gap-2 clickable">
        <button id="pause" class="w-9 h-9 flex items-center justify-center rounded-lg bg-gray-700/50 hover:bg-gray-600/50 transition-colors" title="Pause">
          <svg id="pause-icon" class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
          </svg>
          <svg id="resume-icon" class="w-4 h-4 text-white hidden" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>

        <button id="mic" class="w-9 h-9 flex items-center justify-center rounded-lg transition-colors bg-primary/20 hover:bg-primary/30 hidden" title="Mute mic">
          <svg id="mic-on" class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" />
          </svg>
          <svg id="mic-off" class="w-4 h-4 text-red-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 10v2a7 7 0 01-14 0v-2" />
            <line x1="3" y1="3" x2="21" y2="21" stroke-linecap="round" stroke-width="2" />
          </svg>
        </button>

        <button id="stop" class="w-9 h-9 flex items-center justify-center rounded-lg bg-red-500/20 hover:bg-red-500/30 transition-colors" title="Stop Recording">
          <div class="w-4 h-4 bg-red-500 rounded-sm"></div>
        </button>
      </div>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
